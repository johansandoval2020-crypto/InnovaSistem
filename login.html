<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InnovaSistem — Iniciar sesión</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="login.css?v=20260910b">
</head>
<body>

<a href="index.html" class="back-home">&larr; Volver al inicio</a>
<div class="petals" id="petals"></div>

<div class="auth-card">

  <div class="auth-form-panel">
    <div class="auth-logo">
      <svg viewBox="0 0 64 64" fill="none"><path d="M32 6c-9 8-9 16-4 22 3-9 8-13 4-22Z" fill="#A9714F"/><path d="M32 28c-14 2-20 10-20 20 10-6 16-6 20-20Z" fill="#1E1712"/><path d="M32 28c14 2 20 10 20 20-10-6-16-6-20-20Z" fill="#D3968C"/><rect x="24" y="46" width="16" height="12" rx="3" fill="#6B2A45"/></svg>
      InnovaSistem
    </div>

    <div class="auth-heading">
      <h1 id="heading">Bienvenido de nuevo</h1>
      <p id="subheading">Entrá a tu panel y seguí el control de tu negocio.</p>
    </div>

    <div class="tabs">
      <button type="button" id="tabLogin" class="active">Iniciar sesión</button>
      <button type="button" id="tabRegister">Crear cuenta</button>
    </div>

    <div class="form-msg" id="formMsg"></div>

    <!-- LOGIN -->
    <form class="panel active" id="panelLogin">
      <div class="field">
        <label>Correo electrónico</label>
        <input type="email" name="email" placeholder="tu@negocio.com" required>
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input type="password" name="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="submit-btn">Entrar a mi panel →</button>
      <p class="switch-line">¿No tenés cuenta? <button type="button" data-goto="register">Creá una aquí</button></p>
    </form>

    <!-- REGISTER -->
    <form class="panel" id="panelRegister">
      <div class="field">
        <label>Nombre del negocio</label>
        <input type="text" name="businessName" placeholder="Ej. Clínica San Rafael" required>
      </div>
      <div class="field">
        <label>¿Qué tipo de negocio es?</label>
        <div class="type-select" id="typeSelect">
          <label class="type-card" data-type="clinica"><span class="em"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span><span>Clínica</span></label>
          <label class="type-card" data-type="pupuseria"><span class="em"><svg viewBox="0 0 24 24"><path d="M3 11h18"/><path d="M4 11a8 8 0 0 0 16 0"/><path d="M9 5.5c0-1 .8-2 3-2s3 1 3 2"/></svg></span><span>Pupusería</span></label>
          <label class="type-card" data-type="taller"><span class="em"><svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 1 0-5.4 5.4L4 17l3 3 5.3-5.3a4 4 0 0 0 5.4-5.4l-2 2-2-2 2-2Z"/></svg></span><span>Taller</span></label>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Tu nombre</label>
          <input type="text" name="ownerName" placeholder="Nombre completo" required>
        </div>
        <div class="field">
          <label>Correo</label>
          <input type="email" name="email" placeholder="tu@negocio.com" required>
        </div>
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input type="password" name="password" placeholder="••••••••" required minlength="4">
      </div>
      <button type="submit" class="submit-btn">Crear mi negocio →</button>
      <p class="switch-line">¿Ya tenés cuenta? <button type="button" data-goto="login">Iniciá sesión</button></p>
    </form>
  </div>

  <div class="auth-art-panel">
    <img src="imagenes/login.png" alt="Monte Fuji con cerezos en flor" class="art-photo">
    <svg class="art-petals-svg" viewBox="0 0 520 640" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <g fill="#D3968C" opacity=".85">
        <circle class="fpetal" cx="80" cy="40" r="4"/>
        <circle class="fpetal" cx="180" cy="120" r="3"/>
        <circle class="fpetal" cx="330" cy="60" r="4"/>
        <circle class="fpetal" cx="260" cy="330" r="3"/>
        <circle class="fpetal" cx="380" cy="200" r="4"/>
        <circle class="fpetal" cx="440" cy="90" r="3.5"/>
        <circle class="fpetal" cx="60" cy="260" r="3"/>
      </g>
    </svg>
  </div>
</div>

<script defer src="login.js?v=20260908"></script>
</body>
</html>
