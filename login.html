<!doctype html>
<html lang="es" data-default-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InnovaSistem — Iniciar sesión</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="login.css?v=20261006d">
<link rel="stylesheet" href="ajustes.css?v=20261006a">
<script src="i18n.js?v=20261006c"></script>
<script src="ajustes.js?v=20261006a"></script>
</head>
<body>

<a href="index.html" class="back-home">&larr; Volver al inicio</a>
<div class="auth-card">

  <div class="auth-form-panel">
    <div class="auth-logo">
      <img src="imagenes/logo.png" alt="" class="mascot-logo">
      InnovaSistem
    </div>

    <div class="auth-heading">
      <h1 id="heading">Bienvenido de nuevo</h1>
      <p id="subheading">Entrá a tu panel y seguí el control de tu negocio.</p>
    </div>

    <div class="tabs">
      <button type="button" id="tabLogin" class="active">Iniciar sesión</button>
      <button type="button" id="tabRegister">Crear cuenta</button>
    </div>

    <div class="form-msg" id="formMsg"></div>

    <!-- LOGIN -->
    <form class="panel active" id="panelLogin">
      <div class="field">
        <label>Correo o usuario</label>
        <input type="text" name="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input type="password" name="password" required>
      </div>
      <button type="submit" class="submit-btn">Entrar a mi panel →</button>
      <button type="button" id="gotoAdminLogin" class="admin-btn">
        <svg viewBox="0 0 24 24"><path d="M12 3 4 6.5v5c0 5 3.4 7.7 8 9.5 4.6-1.8 8-4.5 8-9.5v-5L12 3Z"/><path d="M9.5 12.5 11 14l3.5-3.5"/></svg>
        Iniciar sesión como administrador
      </button>
      <p class="switch-line">¿No tenés cuenta? <button type="button" data-goto="register">Creá una aquí</button></p>
    </form>

    <!-- ADMIN LOGIN -->
    <form class="panel" id="panelAdminLogin">
      <div class="field">
        <label>Correo de administrador</label>
        <input type="email" name="email" required>
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input type="password" name="password" required>
      </div>
      <button type="submit" class="submit-btn">Entrar como administrador →</button>
      <p class="switch-line"><button type="button" id="backFromAdminLogin">← Volver a iniciar sesión</button></p>
    </form>

    <!-- REGISTER -->
    <form class="panel" id="panelRegister">
      <div class="field">
        <label>Nombre del negocio</label>
        <input type="text" name="businessName" required>
      </div>
      <div class="field">
        <label>¿Qué tipo de negocio es?</label>
        <div class="type-combo" id="typeCombo">
          <input type="text" id="typeSearch" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="typeList">
          <input type="hidden" name="type" id="typeValue">
          <div class="type-list" id="typeList" role="listbox" hidden></div>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Tu nombre</label>
          <input type="text" name="ownerName" required>
        </div>
        <div class="field">
          <label>Correo</label>
          <input type="email" name="email" required>
        </div>
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input type="password" name="password" required minlength="4">
      </div>
      <button type="submit" class="submit-btn">Crear mi negocio →</button>
      <p class="switch-line">¿Ya tenés cuenta? <button type="button" data-goto="login">Iniciá sesión</button></p>
    </form>
  </div>

  <div class="auth-art-panel">
    <img src="imagenes/ois.png" alt="Peces koi" class="art-photo">
  </div>
</div>

<script src="data.js?v=20261006a"></script>
<script src="api.js?v=20261006a"></script>
<script defer src="login.js?v=20261006b"></script>
</body>
</html>
